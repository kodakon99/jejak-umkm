<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f6f7f9;color:#111827;font:15px/1.4 Figtree,sans-serif;font-variant-numeric:tabular-nums}
header{padding:16px;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}
.brand{font:800 20px Figtree;color:#16a34a}
h1{font:800 24px Figtree;padding:18px 16px 12px}
.sum{margin:0 16px 16px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(17,24,39,.06);display:flex;justify-content:space-between}
.sum b{display:block;font-size:24px}.sum small{color:#6b7280}
.card{margin:0 16px 10px;background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(17,24,39,.05)}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#dcfce7;color:#166534}
.chip.r{background:#fee2e2;color:#991b1b}
.card small{display:block;color:#6b7280}
.tabs{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#6b7280}
.tabs .on{color:#16a34a;font-weight:700}
</style></head><body>
<header><span class="brand">Jejak</span><span>Bu Rina</span></header>
<h1>Pencocokan Oktober</h1>
<div class="sum"><div><b>27</b><small>Cocok</small></div><div><b>3</b><small>Selisih</small></div><div><b>1</b><small>Dicek</small></div></div>
<div class="card"><div><b>10 Okt</b><small>Rp1.155.000</small></div><span class="chip">Cocok</span></div>
<div class="card"><div><b>11 Okt</b><small>Rp720.000</small></div><span class="chip">Cocok</span></div>
<div class="card"><div><b>12 Okt</b><small>QRIS Rp475.000 · Bank Rp173.775</small></div><span class="chip r">Selisih</span></div>
<div class="card"><div><b>13 Okt</b><small>Rp610.000</small></div><span class="chip">Cocok</span></div>
<div class="card"><div><b>14 Okt</b><small>Rp650.000</small></div><span class="chip">Cocok</span></div>
<div class="card"><div><b>15 Okt</b><small>Rp715.000</small></div><span class="chip">Cocok</span></div>
<div class="tabs"><span>Cek</span><span>Rencana</span><span class="on">Cocokkan</span><span>Paket</span></div>
</body></html>
